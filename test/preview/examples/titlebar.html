<ws-titlebar>
    <span ws-x="[$title]">
        <div ws-x="[$title-text]">Basic Titlebar</div>
        <div ws-x="[$subtitle-text]">Subtitle</div>
    </span>
</ws-titlebar>

<ws-titlebar>
    <span ws-x="[$title] [$color @primary] [$title-text]">
        Color Titlebar
    </span>
</ws-titlebar>

<ws-titlebar>
    <span ws-x="[$title] [$color @danger] [$title-text]">
        Titlebar + controls
    </span>

    <label ws-x="@@button [$menu]" for="t-menu">
        <ws-icon class="bi-list" ws-x="[t.sz 20px]"></ws-icon>
    </label>
    <input type="checkbox" ws-x="[hide]" id="t-menu" />
    <ws-modal>
        <ws-paper ws-x="[r 0px] @@menu">
            <ws-flex slot="content">
                <label ws-x="@@button [$outline] [$color @accent]" for="t-menu">
                    Close
                </label>
                <span>
                    This uses a paper for the content of the menu drawer
                </span>
            </ws-flex>
        </ws-paper>
    </ws-modal>
</ws-titlebar>

<ws-titlebar>
    <span ws-x="[$title] [$fill] [$color @primary] [$title-text]">
        Filled Color Titlebar
    </span>
</ws-titlebar>

<ws-titlebar>
    <span ws-x="[$title] [$fill] [$color @secondary] [$title-text]">
        Filled Titlebar + controls
    </span>

    <div ws-x="[grid] [$action]">
        <label ws-x="@@button" for="t-action">
            <ws-icon class="bi-three-dots-vertical" ws-x="[t.sz 20px]"></ws-icon>
        </label>
        <input type="checkbox" ws-x="[hide]" id="t-action" />
        <ws-modal>
            <ws-paper ws-x="[r 0px] @@action">
                <ws-flex slot="content">
                    <label ws-x="@@button [$outline] [$color @accent]" for="t-action">
                        Close
                    </label>
                    <span>
                        Eiusmod ex velit nostrud duis exercitation cillum occaecat.
                    </span>
                </ws-flex>
            </ws-paper>
        </ws-modal>
    </div>
</ws-titlebar>
