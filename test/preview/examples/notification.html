<ws-grid ws-x="[gr.cols 1fr 1fr]">
    <ws-notification>
        <span ws-x="[$notif-text]">
            <ws-icon class="bi-hexagon">Pretend this has useful info</ws-icon>
        </span>
    </ws-notification>
    <ws-notification ws-x="[$color @primary]">
        <span ws-x="[$notif-text]">
            <ws-icon class="bi-hexagon">This info has color</ws-icon>
        </span>
    </ws-notification>

    <ws-notification>
        <ws-icon class="bi-hexagon" ws-x="[$start] [$adorn]"></ws-icon>
        <span ws-x="[$notif-text]">
            Add icons in the border
            <div ws-x="[$subtitle-text]">(probably with color)</div>
        </span>
    </ws-notification>
    <ws-notification ws-x="[$color @secondary]">
        <ws-icon class="bi-hexagon" ws-x="[$end] [$adorn]"></ws-icon>
        <span ws-x="[$notif-text]">
            Icons on either side
        </span>
    </ws-notification>

    <ws-notification ws-x="[$color @warning]">
        <button ws-x="[$flat] [$start]">Click!</button>
        <span ws-x="[$notif-text]">
            <ws-icon class="ti-help-hexagon">You can add controls</ws-icon>
        </span>
    </ws-notification>
    <ws-notification ws-x="[$color @accent]">
        <div ws-x="[$end] [grid] [gr.cols 1fr]">
            <button ws-x="[$flat]">Click!</button>
        </div>
        <span ws-x="[$notif-text]">
            <ws-icon class="ti-help-hexagon">Controls on either side</ws-icon>
        </span>
    </ws-notification>
</ws-grid>
