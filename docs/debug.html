<!doctype html>
<html lang="en">
    <head>
        <link rel="icon" type="image/png" href="https://axel669.net/images/megaman-rounded.png" />
        <meta name="viewport" content="initial-scale=1,maximum-scale=3,minimum-scale=1,width=device-width">
        <meta charset="UTF-8" />

        <title>WS:Debug</title>
    </head>
    <body data-ws="#theme.tron;">
        <script src="ws-es5.js"></script>
        <div data-ws="layout.3x3-center; @width: min(640px, 100%);">
            <ws-surface data-ws="layout.3row-controls; var.outln; raise: 1; @color: @primary;">
                <ws-grid data-ws="gr.cols: 1fr 1fr 1fr; gap: 24px; p: 16px;">
                    <ws-surface data-ws="var.outln;">
                        <ws-text data-ws="p: 8px;">Surface</ws-text>
                    </ws-surface>
                    <ws-surface data-ws="var.outln; raise: 1;">
                        <ws-text data-ws="p: 8px;">Surface</ws-text>
                    </ws-surface>
                    <ws-surface data-ws="var.outln; raise: 2;">
                        <ws-text data-ws="p: 8px;">Surface</ws-text>
                    </ws-surface>
                    <ws-surface data-ws="var.outln; raise: 3;">
                        <ws-text data-ws="p: 8px;">Surface</ws-text>
                    </ws-surface>
                    <ws-surface data-ws="var.outln; raise: 4;">
                        <ws-text data-ws="p: 8px;">Surface</ws-text>
                    </ws-surface>
                    <ws-surface data-ws="var.outln; raise: 5;">
                        <ws-text data-ws="p: 8px;">Surface</ws-text>
                    </ws-surface>
                    <ws-surface data-ws="var.outln; raise: 6;">
                        <ws-text data-ws="p: 8px;">Surface</ws-text>
                    </ws-surface>
                    <ws-surface data-ws="var.outln; raise: 7;">
                        <ws-text data-ws="p: 8px;">Surface</ws-text>
                    </ws-surface>
                    <ws-surface data-ws="var.outln; raise: 8;">
                        <ws-text data-ws="p: 8px;">Surface</ws-text>
                    </ws-surface>
                    <ws-surface data-ws="var.outln; raise: 9;">
                        <ws-text data-ws="p: 8px;">Surface</ws-text>
                    </ws-surface>
                </ws-grid>
            </ws-surface>
        </div>
    </body>
</html>
