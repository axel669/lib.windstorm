                    <script>
                        const color = (name, s, l, i) =>
                            // `<div data-ws="bg.c: hsl(@${name} ${s}% ${l}%);"></div>`
                            `<div data-ws="bg.c: @${name}${i};"></div>`
                        const steps = 12
                        const min = 5
                        const max = 93
                        const step = (max - min) / (steps - 1)
                        const colors = [
                            // ["mono", 0],
                            ["primary", 80],
                            ["success", 80],
                            ["warning", 80],
                            ["error", 80],
                            ["accent", 80],
                            ["info", 80],
                        ]
                        const html = colors.map(
                            ([name, s]) => Array.from(
                                { length: steps },
                                (_, i) => color(name, s, min + (i * step), i + 1)
                            ).join("\n")
                        ).join("\n\n")
                        griddy.innerHTML += html
                    </script>

            const themesel = document.querySelector("#theme")
            let theme = localStorage.theme ?? "tron"
            document.body.dataset.ws = `#theme.${theme};`
            themesel.value = theme
            themesel.addEventListener(
                "change",
                (e) => {
                    const theme = e.target.value
                    document.body.dataset.ws = `#theme.${theme};`
                    localStorage.theme = theme
                }
            )
        </script>
