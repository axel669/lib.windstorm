<div data-ws="h: 240px; pos.rel; b: 1px solid hsl(@mono, @layer-border);">
    <ws-screen data-ws="@screen-width: 240px;">
        <ws-paper data-ws="@color: @primary; variant.outline;">
            <ws-text>
                Standard spacing
            </ws-text>
        </ws-paper>
    </ws-screen>
</div>

<div data-ws="h: 240px; pos.rel; b: 1px solid hsl(@mono, @layer-border);">
    <ws-screen data-ws="@screen-width: 240px; @pad-left: 0px;">
        <ws-paper data-ws="@color: @primary; variant.outline;">
            <ws-text>
                Left Aligned (no pad left)
            </ws-text>
        </ws-paper>
    </ws-screen>
</div>

<div data-ws="h: 240px; pos.rel; b: 1px solid hsl(@mono, @layer-border);">
    <ws-screen data-ws="@screen-width: 240px; @pad-y: 24px;">
        <ws-paper data-ws="@color: @primary; variant.outline;">
            <ws-text>
                Pad top and bottom
            </ws-text>
        </ws-paper>
    </ws-screen>
</div>
