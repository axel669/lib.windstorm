<ws-surface data-ws="var.outln; @color: @primary;">
    <ws-titlebar slot="header" data-ws="var.fill; @color: @secondary;">
        <span data-ws="slot: title; $title;">
            nth-child Selector
        </span>

        <button data-ws="$flat;">
            Blep
            <ws-modal data-ws="$show;">
                <ws-surface data-ws="r: 0px; @menu">
                    <ws-titlebar slot="header">
                        <span data-ws="slot: title; $title;">
                            nth-child Selector
                        </span>
                    </ws-titlebar>

                    <ws-flex data-ws="slot: content;">
                        <label data-ws="$button; var.outln; @color: @accent;" for="action">
                            Close
                        </label>
                        <span>
                            Actiond drawer + paper container
                        </span>
                    </ws-flex>
                </ws-surface>
            </ws-modal>
        </button>
    </ws-titlebar>

    <ws-flex slot="content">
        <div data-ws="nth-child(2n+1):bg: teal;">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
        <div data-ws="nth-child(2n+1):bg: teal;">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
        <div data-ws="nth-child(2n+1):bg: teal;">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </ws-flex>
</ws-surface>

<div data-ws="blep: black;">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
</div>
