<ws-grid data-ws="gr.cols: 1fr 1fr;">
    <ws-toast>
        <span data-ws="$notif-text;">
            <ws-icon data-icon="hexagon">Pretend this has useful info</ws-icon>
        </span>
    </ws-toast>
    <ws-toast data-ws="@color: @primary;">
        <span data-ws="$notif-text;">
            <ws-icon data-icon="hexagon">This info has color</ws-icon>
        </span>
    </ws-toast>

    <ws-toast>
        <ws-icon data-icon="hexagon" data-ws="$start; $adorn;"></ws-icon>
        <span data-ws="$notif-text;">
            Add icons in the border
            <div data-ws="$subtitle-text;">(probably with color)</div>
        </span>
    </ws-toast>
    <ws-toast data-ws="@color: @secondary;">
        <ws-icon data-icon="hexagon" data-ws="$end; $adorn;"></ws-icon>
        <span data-ws="$notif-text;">
            Icons on either side
        </span>
    </ws-toast>

    <ws-toast data-ws="@color: @warning;">
        <button data-ws="$flat; $start; $ground;">Click!</button>
        <span data-ws="$notif-text;">
            <ws-icon data-icon="help-hexagon">You can add controls</ws-icon>
        </span>
    </ws-toast>
    <ws-toast data-ws="@color: @accent;">
        <div data-ws="$end; grid; gr.cols: 1fr;">
            <button data-ws="$flat; $ground;">Click!</button>
        </div>
        <span data-ws="$notif-text;">
            <ws-icon data-icon="help-hexagon">Controls on either side</ws-icon>
        </span>
    </ws-toast>
</ws-grid>
