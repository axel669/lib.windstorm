<ws-modal id="ws_example_modal_simple">
    <ws-dialog>
        <ws-paper data-ws="elevate; w: 240px; h: 180px; @color: @info;">
            <ws-titlebar data-ws="area: header;">
                <ws-text header>Regular Modal</ws-text>
            </ws-titlebar>
            <ws-text>
                Modal Content
            </ws-text>
        </ws-paper>
    </ws-dialog>
</ws-modal>

<ws-modal id="ws_example_modal_persistent" persistent>
    <ws-dialog>
        <ws-paper data-ws="elevate; w: 240px; h: 180px; @color: @info;">
            <ws-titlebar data-ws="area: header;">
                <ws-text header>Persistent Modal</ws-text>
            </ws-titlebar>
            <ws-text>
                Modal Content
            </ws-text>
            <button data-ws="@color: @success; area: footer;" id="ws_modal_close">
                Close
            </button>
        </ws-paper>
    </ws-dialog>
</ws-modal>

<ws-modal id="ws_example_modal_managed" managed>
    <ws-dialog>
        <ws-paper data-ws="elevate; w: 240px; h: 180px; @color: @accent;">
            <ws-titlebar data-ws="area: header;">
                <ws-text header>Managed Modal</ws-text>
            </ws-titlebar>
            <ws-text>
                Modal Content
            </ws-text>
            <button data-ws="@color: @success; area: footer;" id="ws_modal_close_managed">
                Close (for real)
            </button>
        </ws-paper>
    </ws-dialog>
</ws-modal>

<button data-ws="variant.fill; @color: @primary;" id="ws_modal_button_simple">
    Open Standard Modal
</button>

<button data-ws="variant.fill; @color: @accent;" id="ws_modal_button_persistent">
    Open Persistent Modal
</button>

<button data-ws="variant.fill; @color: @accent;" id="ws_modal_button_managed">
    Open Managed Modal
</button>

<script>
    ws_modal_button_simple.addEventListener(
        "click",
        () => ws_example_modal_simple.show()
    )
    ws_modal_button_persistent.addEventListener(
        "click",
        () => ws_example_modal_persistent.show()
    )
    ws_modal_button_managed.addEventListener(
        "click",
        () => ws_example_modal_managed.show()
    )
    ws_modal_close.addEventListener(
        "click",
        () => ws_example_modal_persistent.hide()
    )
    ws_modal_close_managed.addEventListener(
        "click",
        () => ws_example_modal_managed.hide(true)
    )

    ws_example_modal_managed.addEventListener(
        "close",
        () => console.log("closing managed modal?")
    )
</script>
