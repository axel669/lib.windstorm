<ws-grid data-ws="gr.cols: 1fr 1fr; gap: 8px;">
    <ws-titlebar data-ws="col: span 2;">
        <span data-ws="$title; $title-text;">Checkbox</span>
    </ws-titlebar>
    <label toggle data-ws="">
        <span>Outline Checkbox</span>
        <input data-ws type="checkbox" />
    </label>
    <label toggle data-ws="$flat;">
        <span>Flat Checkbox</span>
        <input data-ws type="checkbox" />
    </label>
    <label toggle data-ws="">
        <input data-ws type="checkbox" />
        <span>Outline Checkbox (reverse)</span>
    </label>
    <label toggle data-ws="$flat;">
        <input data-ws type="checkbox" />
        <span>Flat Checkbox (reverse)</span>
    </label>
    <label toggle data-ws="variant.lined-fill;">
        <span>Lined-fill Checkbox</span>
        <input data-ws type="checkbox" />
    </label>
    <label toggle data-ws="variant.lined;">
        <span>Lined Checkbox</span>
        <input data-ws type="checkbox" />
    </label>
    <label toggle data-ws="variant.lined-fill;">
        <input data-ws type="checkbox" />
        <span>Lined-fill Checkbox (reverse)</span>
    </label>
    <label toggle data-ws="variant.lined;">
        <input data-ws type="checkbox" />
        <span>Lined Checkbox (reverse)</span>
    </label>

    <ws-titlebar data-ws="col: span 2;">
        <span data-ws="$title; $title-text;">Switch</span>
    </ws-titlebar>
    <label toggle data-ws="">
        <span>Outline Switch</span>
        <input data-ws type="checkbox" data-ws="@@switch" />
    </label>
    <label toggle data-ws="$flat;">
        <span>Flat Switch</span>
        <input data-ws type="checkbox" data-ws="@@switch" />
    </label>
    <label toggle data-ws="">
        <input data-ws type="checkbox" data-ws="@@switch" />
        <span>Outline Switch (reverse)</span>
    </label>
    <label toggle data-ws="$flat;">
        <input data-ws type="checkbox" data-ws="@@switch" />
        <span>Flat Switch (reverse)</span>
    </label>
    <label toggle data-ws="variant.lined-fill;">
        <span>Lined-fill Switch</span>
        <input data-ws type="checkbox" data-ws="@@switch" />
    </label>
    <label toggle data-ws="variant.lined;">
        <span>Lined Switch</span>
        <input data-ws type="checkbox" data-ws="@@switch" />
    </label>
    <label toggle data-ws="variant.lined-fill;">
        <input data-ws type="checkbox" data-ws="@@switch" />
        <span>Lined-fill Switch (reverse)</span>
    </label>
    <label toggle data-ws="variant.lined;">
        <input data-ws type="checkbox" data-ws="@@switch" />
        <span>Lined Switch (reverse)</span>
    </label>

    <ws-titlebar data-ws="col: span 2;">
        <span data-ws="$title; $title-text;">Radio</span>
    </ws-titlebar>
    <label toggle data-ws="">
        <span>Outline Radio</span>
        <input data-ws type="radio" name="radia" />
    </label>
    <label toggle data-ws="$flat;">
        <span>Flat Radio</span>
        <input data-ws type="radio" name="radia" />
    </label>
    <label toggle data-ws="">
        <input data-ws type="radio" name="radia" />
        <span>Outline Radio (reverse)</span>
    </label>
    <label toggle data-ws="$flat;">
        <input data-ws type="radio" name="radia" />
        <span>Flat Radio (reverse)</span>
    </label>
    <label toggle data-ws="variant.lined-fill;">
        <span>Lined-fill Checkbox</span>
        <input data-ws type="radio" name="radia" />
    </label>
    <label toggle data-ws="variant.lined;">
        <span>Lined Checkbox</span>
        <input data-ws type="radio" name="radia" />
    </label>
    <label toggle data-ws="variant.lined-fill;">
        <input data-ws type="radio" name="radia" />
        <span>Lined-fill Checkbox (reverse)</span>
    </label>
    <label toggle data-ws="variant.lined;">
        <input data-ws type="radio" name="radia" />
        <span>Lined Checkbox (reverse)</span>
    </label>

    <ws-titlebar data-ws="col: span 2;">
        <span data-ws="$title; $title-text;">Colorized</span>
    </ws-titlebar>
    <label toggle data-ws="@color: @primary;">
        <span>Primary</span>
        <input data-ws type="checkbox" />
    </label>
    <label toggle data-ws="@color: @success;">
        <span>Secondary</span>
        <input data-ws type="checkbox" data-ws="@@switch" />
    </label>
    <label toggle data-ws="@color: @accent;">
        <span>Accent</span>
        <input data-ws type="radio" name="radia" />
    </label>
    <label toggle data-ws="@color: @warning; $flat;">
        <span>Warning</span>
        <input data-ws type="checkbox" />
    </label>
    <label toggle data-ws="@color: @error; $flat;">
        <span>Danger</span>
        <input data-ws type="checkbox" data-ws="@@switch" />
    </label>
    <label toggle data-ws="@color: @warning; variant.lined;">
        <span>Lined Warning</span>
        <input data-ws type="checkbox" />
    </label>
    <label toggle data-ws="@color: @error; variant.lined;">
        <span>Lined Danger</span>
        <input data-ws type="checkbox" data-ws="@@switch" />
    </label>

    <ws-titlebar data-ws="col: span 2;">
        <span data-ws="$title; $title-text;">Disabled</span>
    </ws-titlebar>
    <label toggle data-ws="@color: @primary;">
        <span>Primary</span>
        <input data-ws type="checkbox" disabled />
    </label>
    <label toggle data-ws="@color: @success;">
        <span>Secondary</span>
        <input data-ws type="checkbox" data-ws="@@switch" disabled />
    </label>
    <label toggle data-ws="@color: @accent;">
        <span>Accent</span>
        <input data-ws type="radio" name="radia" disabled />
    </label>
    <label toggle data-ws="@color: @warning; $flat;">
        <span>Warning</span>
        <input data-ws type="checkbox" disabled />
    </label>
    <label toggle data-ws="@color: @error; $flat;">
        <span>Danger</span>
        <input data-ws type="checkbox" data-ws="@@switch" disabled />
    </label>
</ws-grid>
