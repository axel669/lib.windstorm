<div data-ws="h: 240px;">
    <ws-select>
        <ws-option>First</ws-option>
        <ws-option>Second</ws-option>
        <ws-optgroup label="Group">
            <ws-option>Third</ws-option>
            <ws-option>Fourth</ws-option>
        </ws-optgroup>
    </ws-select>

    <ws-select data-ws="@color: @success; variant.outline;">
        <ws-option>First</ws-option>
        <ws-option>Second</ws-option>
        <ws-optgroup label="Group">
            <ws-option>Third</ws-option>
            <ws-option>Fourth</ws-option>
        </ws-optgroup>
    </ws-select>

    <ws-select data-ws="@color: @info; variant.lined;" direction="up">
        <ws-option>First</ws-option>
        <ws-option>Second</ws-option>
        <ws-optgroup label="Group">
            <ws-option>Third</ws-option>
            <ws-option>Fourth</ws-option>
        </ws-optgroup>
    </ws-select>
    <ws-select data-ws="@color: @info; variant.lined;" direction="up" disabled>
        <ws-option>First</ws-option>
        <ws-option>Second</ws-option>
        <ws-optgroup label="Group">
            <ws-option>Third</ws-option>
            <ws-option>Fourth</ws-option>
        </ws-optgroup>
    </ws-select>
</div>
