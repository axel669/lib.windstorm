<div data-ws="h: 240px;">
    <ws-select>
        <ws-option>First</ws-option>
        <ws-option>Second</ws-option>
        <ws-optgroup label="Group">
            <ws-option>Third</ws-option>
            <ws-option>Fourth</ws-option>
        </ws-optgroup>
    </ws-select>

    <ws-select data-ws="@color: @success; var.outln;">
        <ws-option>First</ws-option>
        <ws-option>Second</ws-option>
        <ws-optgroup label="Group">
            <ws-option>Third</ws-option>
            <ws-option>Fourth</ws-option>
        </ws-optgroup>
    </ws-select>

    <ws-select data-ws="@color: @info; var.lined;" direction="up">
        <ws-option>First</ws-option>
        <ws-option>Second</ws-option>
        <ws-optgroup label="Group">
            <ws-option>Third</ws-option>
            <ws-option>Fourth</ws-option>
        </ws-optgroup>
    </ws-select>
    <ws-select data-ws="@color: @info; var.lined;" direction="up" disabled>
        <ws-option>First</ws-option>
        <ws-option>Second</ws-option>
        <ws-optgroup label="Group">
            <ws-option>Third</ws-option>
            <ws-option>Fourth</ws-option>
        </ws-optgroup>
    </ws-select>
    <ws-select data-ws="@color: @accent; var.lined;" direction="up">
        <div slot="selected">
            Theme: <ws-selected></ws-selected>
        </div>
        <ws-option><ws-icon data-icon="sun"></ws-icon></ws-option>
        <ws-option><ws-icon data-icon="moon"></ws-icon></ws-option>
        <ws-option><ws-icon data-icon="hexagon-3d"></ws-icon></ws-option>
    </ws-select>
</div>
