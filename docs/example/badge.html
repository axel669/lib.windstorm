<ws-flex>
    <div data-ws="p.b: 12px;">
        Add a badge in the corner of some area, can control the color
    </div>
    <ws-badge ws-text="0" data-ws="w: 30%;">
        <div data-ws="p: 8px; b: 1px solid hsl(@primary, @layer-border); r: 4px;">
            <ws-icon data-icon="mail">
                Messages
            </ws-icon>
        </div>
    </ws-badge>
    <ws-badge ws-text="text" data-ws="w: 30%; @color: @success;">
        <div data-ws="p: 8px; b: 1px solid hsl(@success, @layer-border); r: 4px;">
            <ws-icon data-icon="hexagon">
                I Dunno
            </ws-icon>
        </div>
    </ws-badge>
</ws-flex>
