<ws-grid data-ws="gr.cols-fit: 240px, 1fr; gap: 8px;">
    <ws-titlebar>
        <ws-text title>
            Basic Titlebar
        </ws-text>
    </ws-titlebar>
    <ws-titlebar>
        <ws-text title>
            Basic Titlebar
            <ws-text subtitle>With Subtitle</ws-text>
        </ws-text>
    </ws-titlebar>

    <ws-titlebar data-ws="@color: @success;">
        <ws-text title>
            Colorized Titlebar
        </ws-text>
    </ws-titlebar>

    <ws-titlebar data-ws="@color: @error;">
        <ws-text title>
            Colorized Titlebar
            <ws-text subtitle>+ Controls</ws-text>
        </ws-text>

        <button data-ws="area: menu; @color: @error;">
            <ws-icon data-icon="menu-2"></ws-icon>
        </button>
    </ws-titlebar>

    <ws-titlebar data-ws="variant.fill; @color: @accent;">
        <ws-text title>
            Filled Titlebar
        </ws-text>
    </ws-titlebar>

    <ws-titlebar data-ws="variant.fill; @color: @info;">
        <ws-text title>
            Filled Titlebar
            <ws-text subtitle>+ Controls</ws-text>
        </ws-text>

        <label button data-ws="area: action; pad.compact;">
            Done
        </label>
    </ws-titlebar>

    <ws-paper data-ws="elevate;">
        <ws-titlebar data-ws="area: header;">
            <ws-text title>
                Flat Titlebar
                <ws-text subtitle>in Paper</ws-text>
            </ws-text>
        </ws-titlebar>
        <ws-flex>
            <div>Paper Content</div>
        </ws-flex>
    </ws-paper>

    <ws-paper data-ws="variant.outline;">
        <ws-titlebar data-ws="area: header; variant.fill;">
            <ws-text title>
                Filled Titlebar
                <ws-text subtitle>in Paper</ws-text>
            </ws-text>
        </ws-titlebar>
        <ws-flex>
            <div>Paper Content</div>
        </ws-flex>
    </ws-paper>
</ws-grid>
