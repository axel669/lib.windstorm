<ws-grid data-ws="gr.cols: repeat(3, 1fr);">
    <div data-ws="col: span 3;">Primary Color / Disabled / Elevated</div>
    <button data-ws="@color: @primary;">Flat</button>
    <button data-ws="@color: @primary; variant.outline;">Outline</button>
    <button data-ws="@color: @primary; variant.fill;">Fill</button>
    <button disabled data-ws="@color: @primary;">Flat</button>
    <button disabled data-ws="@color: @primary; variant.outline;">Outline</button>
    <button disabled data-ws="@color: @primary; variant.fill;">Fill</button>
    <button data-ws="@color: @primary; elevate;">Flat</button>
    <button data-ws="@color: @primary; elevate; variant.outline;">Outline</button>
    <button data-ws="@color: @primary; elevate; variant.fill;">Fill</button>

    <div data-ws="col: span 3;">Accent Color / Disabled / Elevated</div>
    <button data-ws="@color: @accent;">Flat</button>
    <button data-ws="@color: @accent; variant.outline;">Outline</button>
    <button data-ws="@color: @accent; variant.fill;">Fill</button>
    <button disabled data-ws="@color: @accent;">Flat</button>
    <button disabled data-ws="@color: @accent; variant.outline;">Outline</button>
    <button disabled data-ws="@color: @accent; variant.fill;" disabled>Fill</button>
    <button data-ws="@color: @accent; elevate;">Flat</button>
    <button data-ws="@color: @accent; elevate; variant.outline;">Outline</button>
    <button data-ws="@color: @accent; elevate; variant.fill;">Fill</button>

    <div data-ws="col: span 3;">Info Color / Disabled / Elevated</div>
    <button data-ws="@color: @info;">Flat</button>
    <button data-ws="@color: @info; variant.outline;">Outline</button>
    <button data-ws="@color: @info; variant.fill;">Fill</button>
    <button disabled data-ws="@color: @info;">Flat</button>
    <button disabled data-ws="@color: @info; variant.outline;">Outline</button>
    <button disabled data-ws="@color: @info; variant.fill;" disabled>Fill</button>
    <button data-ws="@color: @info; elevate;">Flat</button>
    <button data-ws="@color: @info; elevate; variant.outline;">Outline</button>
    <button data-ws="@color: @info; elevate; variant.fill;">Fill</button>

    <div data-ws="col: span 3;">Success Color / Disabled / Elevated</div>
    <button data-ws="@color: @success;">Flat</button>
    <button data-ws="@color: @success; variant.outline;">Outline</button>
    <button data-ws="@color: @success; variant.fill;">Fill</button>
    <button disabled data-ws="@color: @success;">Flat</button>
    <button disabled data-ws="@color: @success; variant.outline;">Outline</button>
    <button disabled data-ws="@color: @success; variant.fill;" disabled>Fill</button>
    <button data-ws="@color: @success; elevate;">Flat</button>
    <button data-ws="@color: @success; elevate; variant.outline;">Outline</button>
    <button data-ws="@color: @success; elevate; variant.fill;">Fill</button>

    <div data-ws="col: span 3;">Warning Color / Disabled / Elevated</div>
    <button data-ws="@color: @warning;">Flat</button>
    <button data-ws="@color: @warning; variant.outline;">Outline</button>
    <button data-ws="@color: @warning; variant.fill;">Fill</button>
    <button disabled data-ws="@color: @warning;">Flat</button>
    <button disabled data-ws="@color: @warning; variant.outline;">Outline</button>
    <button disabled data-ws="@color: @warning; variant.fill;">Fill</button>
    <button data-ws="@color: @warning; elevate;">Flat</button>
    <button data-ws="@color: @warning; elevate; variant.outline;">Outline</button>
    <button data-ws="@color: @warning; elevate; variant.fill;">Fill</button>

    <div data-ws="col: span 3;">Error Color / Disabled / Elevated</div>
    <button data-ws="@color: @error;">Flat</button>
    <button data-ws="@color: @error; variant.outline;">Outline</button>
    <button data-ws="@color: @error; variant.fill;">Fill</button>
    <button disabled data-ws="@color: @error;">Flat</button>
    <button disabled data-ws="@color: @error; variant.outline;">Outline</button>
    <button disabled data-ws="@color: @error; variant.fill;">Fill</button>
    <button data-ws="@color: @error; elevate;">Flat</button>
    <button data-ws="@color: @error; elevate; variant.outline;">Outline</button>
    <button data-ws="@color: @error; elevate; variant.fill;">Fill</button>
</ws-grid>
