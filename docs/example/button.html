<ws-grid data-ws="gr.cols: repeat(3, 1fr);">
    <div data-ws="col: span 3;">Primary Color / Disabled / Elevated</div>
    <button data-ws="@color: @primary;">Flat</button>
    <button data-ws="@color: @primary; var.outln;">Outline</button>
    <button data-ws="@color: @primary; var.fill;">Fill</button>
    <button disabled data-ws="@color: @primary;">Flat</button>
    <button disabled data-ws="@color: @primary; var.outln;">Outline</button>
    <button disabled data-ws="@color: @primary; var.fill;">Fill</button>
    <button data-ws="@color: @primary; raised;">Flat</button>
    <button data-ws="@color: @primary; raised; var.outln;">Outline</button>
    <button data-ws="@color: @primary; raised; var.fill;">Fill</button>

    <div data-ws="col: span 3;">Accent Color / Disabled / Elevated</div>
    <button data-ws="@color: @accent;">Flat</button>
    <button data-ws="@color: @accent; var.outln;">Outline</button>
    <button data-ws="@color: @accent; var.fill;">Fill</button>
    <button disabled data-ws="@color: @accent;">Flat</button>
    <button disabled data-ws="@color: @accent; var.outln;">Outline</button>
    <button disabled data-ws="@color: @accent; var.fill;" disabled>Fill</button>
    <button data-ws="@color: @accent; raised;">Flat</button>
    <button data-ws="@color: @accent; raised; var.outln;">Outline</button>
    <button data-ws="@color: @accent; raised; var.fill;">Fill</button>

    <div data-ws="col: span 3;">Info Color / Disabled / Elevated</div>
    <button data-ws="@color: @info;">Flat</button>
    <button data-ws="@color: @info; var.outln;">Outline</button>
    <button data-ws="@color: @info; var.fill;">Fill</button>
    <button disabled data-ws="@color: @info;">Flat</button>
    <button disabled data-ws="@color: @info; var.outln;">Outline</button>
    <button disabled data-ws="@color: @info; var.fill;" disabled>Fill</button>
    <button data-ws="@color: @info; raised;">Flat</button>
    <button data-ws="@color: @info; raised; var.outln;">Outline</button>
    <button data-ws="@color: @info; raised; var.fill;">Fill</button>

    <div data-ws="col: span 3;">Success Color / Disabled / Elevated</div>
    <button data-ws="@color: @success;">Flat</button>
    <button data-ws="@color: @success; var.outln;">Outline</button>
    <button data-ws="@color: @success; var.fill;">Fill</button>
    <button disabled data-ws="@color: @success;">Flat</button>
    <button disabled data-ws="@color: @success; var.outln;">Outline</button>
    <button disabled data-ws="@color: @success; var.fill;" disabled>Fill</button>
    <button data-ws="@color: @success; raised;">Flat</button>
    <button data-ws="@color: @success; raised; var.outln;">Outline</button>
    <button data-ws="@color: @success; raised; var.fill;">Fill</button>

    <div data-ws="col: span 3;">Warning Color / Disabled / Elevated</div>
    <button data-ws="@color: @warning;">Flat</button>
    <button data-ws="@color: @warning; var.outln;">Outline</button>
    <button data-ws="@color: @warning; var.fill;">Fill</button>
    <button disabled data-ws="@color: @warning;">Flat</button>
    <button disabled data-ws="@color: @warning; var.outln;">Outline</button>
    <button disabled data-ws="@color: @warning; var.fill;">Fill</button>
    <button data-ws="@color: @warning; raised;">Flat</button>
    <button data-ws="@color: @warning; raised; var.outln;">Outline</button>
    <button data-ws="@color: @warning; raised; var.fill;">Fill</button>

    <div data-ws="col: span 3;">Error Color / Disabled / Elevated</div>
    <button data-ws="@color: @error;">Flat</button>
    <button data-ws="@color: @error; var.outln;">Outline</button>
    <button data-ws="@color: @error; var.fill;">Fill</button>
    <button disabled data-ws="@color: @error;">Flat</button>
    <button disabled data-ws="@color: @error; var.outln;">Outline</button>
    <button disabled data-ws="@color: @error; var.fill;">Fill</button>
    <button data-ws="@color: @error; raised;">Flat</button>
    <button data-ws="@color: @error; raised; var.outln;">Outline</button>
    <button data-ws="@color: @error; raised; var.fill;">Fill</button>
</ws-grid>
