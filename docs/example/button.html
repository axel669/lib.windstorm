<ws-grid ws-x="[gr.cols repeat(3, 1fr)]">
    <div ws-x="[col span 3]">Primary Color / Disabled / Elevated</div>
    <button ws-x="[$color @primary]">Flat</button>
    <button ws-x="[$color @primary] [$outline]">Outline</button>
    <button ws-x="[$color @primary] [$fill]">Fill</button>
    <button disabled ws-x="[$color @primary]">Flat</button>
    <button disabled ws-x="[$color @primary] [$outline]">Outline</button>
    <button disabled ws-x="[$color @primary] [$fill]">Fill</button>
    <button ws-x="[$color @primary] [$elevate]">Flat</button>
    <button ws-x="[$color @primary] [$elevate] [$outline]">Outline</button>
    <button ws-x="[$color @primary] [$elevate] [$fill]">Fill</button>

    <div ws-x="[col span 3]">Accent Color / Disabled / Elevated</div>
    <button ws-x="[$color @accent]">Flat</button>
    <button ws-x="[$color @accent] [$outline]">Outline</button>
    <button ws-x="[$color @accent] [$fill]">Fill</button>
    <button disabled ws-x="[$color @accent]">Flat</button>
    <button disabled ws-x="[$color @accent] [$outline]">Outline</button>
    <button disabled ws-x="[$color @accent] [$fill]" disabled>Fill</button>
    <button ws-x="[$color @accent] [$elevate]">Flat</button>
    <button ws-x="[$color @accent] [$elevate] [$outline]">Outline</button>
    <button ws-x="[$color @accent] [$elevate] [$fill]">Fill</button>

    <div ws-x="[col span 3]">Info Color / Disabled / Elevated</div>
    <button ws-x="[$color @info]">Flat</button>
    <button ws-x="[$color @info] [$outline]">Outline</button>
    <button ws-x="[$color @info] [$fill]">Fill</button>
    <button disabled ws-x="[$color @info]">Flat</button>
    <button disabled ws-x="[$color @info] [$outline]">Outline</button>
    <button disabled ws-x="[$color @info] [$fill]" disabled>Fill</button>
    <button ws-x="[$color @info] [$elevate]">Flat</button>
    <button ws-x="[$color @info] [$elevate] [$outline]">Outline</button>
    <button ws-x="[$color @info] [$elevate] [$fill]">Fill</button>

    <div ws-x="[col span 3]">Success Color / Disabled / Elevated</div>
    <button ws-x="[$color @success]">Flat</button>
    <button ws-x="[$color @success] [$outline]">Outline</button>
    <button ws-x="[$color @success] [$fill]">Fill</button>
    <button disabled ws-x="[$color @success]">Flat</button>
    <button disabled ws-x="[$color @success] [$outline]">Outline</button>
    <button disabled ws-x="[$color @success] [$fill]" disabled>Fill</button>
    <button ws-x="[$color @success] [$elevate]">Flat</button>
    <button ws-x="[$color @success] [$elevate] [$outline]">Outline</button>
    <button ws-x="[$color @success] [$elevate] [$fill]">Fill</button>

    <div ws-x="[col span 3]">Warning Color / Disabled / Elevated</div>
    <button ws-x="[$color @warning]">Flat</button>
    <button ws-x="[$color @warning] [$outline]">Outline</button>
    <button ws-x="[$color @warning] [$fill]">Fill</button>
    <button disabled ws-x="[$color @warning]">Flat</button>
    <button disabled ws-x="[$color @warning] [$outline]">Outline</button>
    <button disabled ws-x="[$color @warning] [$fill]">Fill</button>
    <button ws-x="[$color @warning] [$elevate]">Flat</button>
    <button ws-x="[$color @warning] [$elevate] [$outline]">Outline</button>
    <button ws-x="[$color @warning] [$elevate] [$fill]">Fill</button>

    <div ws-x="[col span 3]">Error Color / Disabled / Elevated</div>
    <button ws-x="[$color @error]">Flat</button>
    <button ws-x="[$color @error] [$outline]">Outline</button>
    <button ws-x="[$color @error] [$fill]">Fill</button>
    <button disabled ws-x="[$color @error]">Flat</button>
    <button disabled ws-x="[$color @error] [$outline]">Outline</button>
    <button disabled ws-x="[$color @error] [$fill]">Fill</button>
    <button ws-x="[$color @error] [$elevate]">Flat</button>
    <button ws-x="[$color @error] [$elevate] [$outline]">Outline</button>
    <button ws-x="[$color @error] [$elevate] [$fill]">Fill</button>
</ws-grid>
