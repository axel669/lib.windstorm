<ws-flex>
    <ws-titlebar>
        <ws-text title>
            Column Direction (default)
        </ws-text>
    </ws-titlebar>
    <ws-flex>
        <ws-chip data-ws="var.outln; @color: @primary;">
            Item 1
        </ws-chip>
        <ws-chip data-ws="var.outln; @color: @primary;">
            Item 2
        </ws-chip>
        <ws-chip data-ws="var.outln; @color: @primary;">
            Item 3
        </ws-chip>
        <ws-chip data-ws="var.outln; @color: @primary;">
            Item 4
        </ws-chip>
    </ws-flex>

    <ws-titlebar>
        <ws-text title>
            Row Direction
        </ws-text>
    </ws-titlebar>
    <ws-flex data-ws="fl.dir: row;">
        <ws-chip data-ws="var.outln; @color: @primary;">
            Item 1
        </ws-chip>
        <ws-chip data-ws="var.outln; @color: @primary;">
            Item 2
        </ws-chip>
        <ws-chip data-ws="var.outln; @color: @primary;">
            Item 3
        </ws-chip>
        <ws-chip data-ws="var.outln; @color: @primary;">
            Item 4
        </ws-chip>
    </ws-flex>

    <ws-titlebar>
        <ws-text title>
            Flex Item Properties
        </ws-text>
    </ws-titlebar>
    <ws-flex data-ws="fl.dir: row; fl.wr: wrap;">
        <ws-chip data-ws="var.outln; @color: @primary; fl.grow: 1;">
            Item 1
        </ws-chip>
        <ws-chip data-ws="var.outln; @color: @primary; fl.grow: 3;">
            Item 2
        </ws-chip>
        <ws-chip data-ws="var.outln; @color: @primary; fl.grow: 1;">
            Item 3
        </ws-chip>
        <ws-chip data-ws="var.outln; @color: @primary; fl.grow: 2; fl.basis: 150px;">
            Item 4
        </ws-chip>
    </ws-flex>
</ws-flex>
