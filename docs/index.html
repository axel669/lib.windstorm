<!doctype html>
<html>
    <head>
        <link rel="icon" type="image/png" href="https://axel669.net/images/megaman-rounded.png" />
        <meta name="viewport" content="initial-scale=1,maximum-scale=3,minimum-scale=1,width=device-width">
        <meta charset="UTF-8" />

        <link rel="stylesheet" href="./style.css" />

        <title></title>
    </head>
    <body>
        <script type="module">
            import "./byblos.js"

            const [code, frame] = byblos.html`
                <div></div>
                <div></div>
            `

            byblos.init({
                repo: "axel669/byblos",
                branch: "dev",
                sidebar: {
                    title: "Navigation",
                },
                "page.title": "Windstorm Docs",
                "docs.title": "Windstorm",
                localMode: true,
                theme: "dark",
                plugins: [
                    {
                        preRender(contents) {
                            contents.page.content =
                                contents.page.content
                                .replaceAll("$VERSION", byblos.ws.version)
                        }
                    },
                    {
                        init(nodes) {
                            nodes.contentArea.append(frame, code)
                            document.addEventListener(
                                "byblos:route-change",
                                () => {
                                    frame.innerHTML = ""
                                    code.innerHTML = ""
                                }
                            )
                        },
                        resolve(targets) {
                            const url = targets.page.url
                            if (url.startsWith("/component/") === false) {
                                return
                            }
                            const exampleURL =
                                url
                                .replace("/component/", "/example/")
                                .replace(".md", ".html")
                            targets.example = {
                                type: "example",
                                url: exampleURL
                            }
                        },
                        display(content) {
                            if (content.example === undefined) {
                                return
                            }

                            const [ frameDetails ] = byblos.html`
                                <details data-ws="@color: @accent;" open>
                                    <summary>Demo</summary>
                                </details>
                            `
                            frameDetails.innerHTML += content.example
                            frame.append(frameDetails)
                            code.innerHTML = `
                                <details data-ws="@color: @accent;">
                                    <summary>Code Example</summary>
                                    ${byblos.marked.parse(`\`\`\`html\n${content.example}\n\`\`\``)}
                                </details>
                            `
                            byblos.addCodeCopy(
                                code.querySelector("pre")
                            )

                            const scripts = frameDetails.querySelectorAll("script")
                            for (const script of scripts) {
                                const f = new Function("frame", script.innerText)
                                f(frameDetails)
                            }
                        }
                    },
                    {
                        init(nodes) {
                            window.addEventListener(
                                "storage",
                                () => console.log(localStorage)
                            )
                            const [ themeSelector ] = byblos.html`
                                <ws-select data-ws="area: action; outln: none; w: 110px; @color: @info; fill.reset;">
                                    <ws-option value="light">
                                        <ws-icon data-icon="sun"></ws-icon> Light
                                    </ws-option>
                                    <ws-option value="dark">
                                        <ws-icon data-icon="moon"></ws-icon> Dark
                                    </ws-option>
                                    <ws-option value="tron">
                                        <ws-icon data-icon="disc"></ws-icon> Tron
                                    </ws-option>
                                </ws-select>
                            `
                            nodes.titlebar.append(themeSelector)
                            themeSelector.value = byblos.theme
                            themeSelector.addEventListener(
                                "change",
                                (e) => byblos.theme = e.target.value
                            )
                        }
                    }
                ]
            })
        </script>
    </body>
</html>
